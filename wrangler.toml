# SecureFlow on Cloudflare Workers: static pages + /api (Gemini analysis, D1 codebase memory).
# `npm run deploy` builds dist/site, creates the D1 database if needed, fills in database_id, applies migrations,
# uploads GEMINI_API_KEY as a secret (from .dev.vars) and deploys.
name = "secureflow"
main = "worker/index.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "secureflow-memory"
database_id = "c057295f-62b3-4d81-916e-0aa231ba62f6"
migrations_dir = "migrations"

# R2 Bucket (uncomment once R2 is enabled in Cloudflare Dashboard; D1 fallback is active)
# [[r2_buckets]]
# binding = "PROJECTS"
# bucket_name = "secureflow-projects"

[triggers]
crons = ["*/30 * * * *"]

[vars]
GEMINI_MODELS = "gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3.1-flash-lite,gemini-flash-lite-latest,gemini-3-flash-preview,gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-flash-latest"
RATE_PER_HOUR = "150"
FIREBASE_PROJECT_ID = "hackfest-ju"
FIREBASE_AUTH_DOMAIN = "hackfest-ju.firebaseapp.com"
FIREBASE_API_KEY = "AIzaSyBAPIk9yQ399Ej52AU_No7F1y7mcsrPqS4"
FIREBASE_STORAGE_BUCKET = "hackfest-ju.firebasestorage.app"
FIREBASE_MESSAGING_SENDER_ID = "803262096156"
FIREBASE_APP_ID = "1:803262096156:web:1963ef3030c43c13f490d9"
FIREBASE_MEASUREMENT_ID = "G-5PQ6FNMR8C"
GITHUB_CLIENT_ID = "Ov23limMkWB5AvchAZYj"
PUBLIC_URL = "https://secureflow.rajaditya311007.workers.dev"
ALERT_FROM = "alerts@secureflow.dev"

[observability]
enabled = true
